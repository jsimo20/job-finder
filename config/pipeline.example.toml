# EXAMPLE pipeline configuration — a working demonstration, not anyone's
# real search. Copy it and replace every value with your own:
#
#     cp config/pipeline.example.toml config/pipeline.toml
#
# config/pipeline.toml is gitignored (search preferences are personal); the
# pipeline falls back to this example when no real config exists, so a fresh
# clone runs out of the box. Contact details and EEO answers never belong in
# either file — those live in profile/.

[filters]
# Annual base pay. Every pay number here is in `currency`; `currency_symbol`
# is how the digest prints them.
comp_floor = 140000
currency = "USD"
currency_symbol = "$"
# Roles asking for more years than this route to the stretch queue.
yoe_main_queue_max = 7
# A title with no level word ("Product Manager, Growth") reaches the main queue
# only when the JD asks for at least this many years; otherwise it goes to stretch.
untitled_min_yoe = 5
# Postings open longer than this are dropped as likely evergreen reqs.
stale_days = 30
# Posted base-salary minimums at or above each threshold add one point to the
# comp score. Order low to high; use [] to ignore comp in scoring.
comp_score_thresholds = [170000, 200000]

# ── Role targeting ───────────────────────────────────────────────────────────
# Which job titles the pipeline is hunting. Edit every pattern for your own
# market; the defaults target senior product management roles.

[titles]
# A title must match one of these to count as a target role at all.
role_patterns = ['\b(product manager|product management|head of product|product lead)\b']
# Adjacent tracks that share vocabulary but are out of scope.
exclude_track = '\b(product marketing|PMM|project manager|program manager|TPM|technical program|product owner|scrum master|product designer|UX designer|UI designer)\b'
# Titles containing target words that are really a different job.
exclude_role = '\b(engineer|engineering|developer|scientist|analyst|architect|researcher|data engineer|software engineer|security engineer|full[- ]?stack)\b'
# Seniority band: must match keep, must not match reject; above-band titles
# are discarded separately.
seniority_keep = '\b(senior|sr\.?|staff|principal|lead|group|head of product)\b'
seniority_reject = '\b(associate product manager|associate pm|APM|junior|jr\.?|intern|product manager (i|ii)\b|PM I+\b)\b'
above_band = '\b(director|VP|vice president|chief|SVP|EVP|head of (?!product\b))'

[extraction]
# How the extraction prompt describes the roles it reads. Keep short.
role_noun = "product manager"
senior_scope = "a typical Senior/Staff PM scope"

# ── Location scope ───────────────────────────────────────────────────────────
# The scope is always your geography plus remote roles you can take:
# in_scope_patterns: a posting passes when its location string matches ANY
# pattern (case-insensitive).
# remote: a remote posting passes unless its location names somewhere else
# (remote_exclude_patterns), or, when remote_require_patterns is set, unless it
# names your market.
# tiers: drive-time buckets from your home base, used only for the commute
# warning in the digest. Checked far-first, because a distant city often also
# matches a nearby state token ("Boston, MA" matches the MA that places
# Springfield).

[location]
# The country you can work from. The extraction prompt asks whether a remote
# role allows working from here.
country = "United States"
# Replace with your own metros. Placeholders below are obviously fictional so
# nothing steers you before you edit.
in_scope_patterns = [
    '\b(examplecity|nearbytown|midtown|EX)\b',
]
# Boards tag remote roles outside their home market like "Remote - EMEA" or
# "Canada - Remote"; a bare "Remote" is read as in-country. Edit for your
# country: a user in Canada removes canada and adds the US.
remote_exclude_patterns = [
    '\b(emea|apac|latam|uk only|europe only|eu only|india only|canada only)\b',
    '\bremote\s*[-,]\s*(uk|emea|eu|europe|india|canada|australia|new\s*zealand|japan|philippines|vietnam|singapore|hong\s*kong|israel|brazil|mexico|argentina|colombia|chile|costa\s*rica|germany|france|spain|italy|netherlands|poland|portugal|sweden|denmark|norway|finland|ireland|united\s*kingdom|switzerland)\b',
    '\b(canada|united\s*kingdom|ireland|germany|france|spain|italy|netherlands|poland|portugal|sweden|denmark|norway|finland|switzerland|japan|philippines|vietnam|singapore|hong\s*kong|israel|india|brazil|mexico|argentina|colombia|chile|costa\s*rica|australia|new\s*zealand)[-,\s]+remote\b',
]
# Outside the US, a bare "Remote" on a US-based board usually means US-only.
# When this list is non-empty a remote role must also match one of these, so a
# UK user would set ['\b(uk|united kingdom|europe|emea)\b'].
remote_require_patterns = []

[location.tiers]
# Drive-time buckets from your home base, used only for the commute warning.
# Checked far-first: a far city often also matches a near state token.
near = '\b(nearbytown|EX)\b'
mid = '\b(midtown)\b'
far = '\b(examplecity)\b'

[location.commute]
# Warn (never discard) when a role's onsite days meet the tier's threshold.
far_min_days = 4
mid_min_days = 5
far_note = "~2h each way from home"
mid_note = "~1h each way from home"

# ── Domain taxonomy ──────────────────────────────────────────────────────────
# The extraction model tags each role with these domains; the scorer sums the
# weights. Add, remove, or reweight to match your own background. Definitions
# feed the extraction prompt, so keep them one line and concrete.

[domains.ai_agentic]
weight = 5
definition = "AI/agentic/LLM platforms, foundation models, agent infra"

[domains.developer_platform]
weight = 4
definition = "Developer platforms, partner ecosystems, public APIs, SDKs"

[domains.consumer_at_scale]
weight = 4
definition = "Consumer products with 1M+ active users"

[domains.iot_edge]
weight = 3
definition = "IoT, edge computing, smart home, embedded systems"

[domains.connectivity_telecom]
weight = 3
definition = "Telecom, networking, 5G, ISPs, connectivity infra, CDN/edge networks"

[domains.silicon]
weight = 3
definition = "Chips, semiconductors, photonics, hardware acceleration"

[domains.space]
weight = 3
definition = "Space tech, satellites, launch, earth observation, in-orbit services"

[domains.quantum]
weight = 3
definition = "Quantum computing hardware, software, cloud services"

[domains.health_bio]
weight = 2
definition = "Clinical AI, diagnostics, life-sciences tooling, bio platforms"

# ── Company-stage taxonomy ───────────────────────────────────────────────────

[stages.series_b_d_ai_native]
weight = 4
definition = "Series B-D, AI-native or platform-native company"

[stages.public_new_ai_line]
weight = 3
definition = "Public company launching a new AI/platform product line"

[stages.late_stage_pre_ipo]
weight = 3
definition = "Late-stage private with strong product culture, pre-IPO"

[stages.mega_corp_10k]
weight = 2
definition = "Public/private mega-corp with 10K+ employees, slower but stable"

[stages.seed_series_a]
weight = 1
definition = "Seed or Series A, usually founder-led PM"

# ── Company discovery ────────────────────────────────────────────────────────
# Each weekly run scans these Built In regional sites for companies posting the
# target role that the tracked list is missing, and lists them in the digest
# for a yes/no. [] disables it. Example: "https://www.builtinboston.com".

[discovery]
builtin_sites = []
builtin_category = "product-management"
# Only listings posted within this many days are considered.
max_age_days = 7
max_pages = 60
