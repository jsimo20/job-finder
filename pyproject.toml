[project]
name = "job-finder"
version = "1.3.2"
description = "Finds roles worth applying to, tailors the application, and fills the form up to Submit; runs in a Claude Cowork folder."
# 3.10 is the floor because the Cowork device VM runs it. tomllib is the only
# 3.11+ import in the codebase and is backfilled by tomli below.
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "reportlab>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "anthropic>=0.40",       # the evals only
    "python-dotenv>=1.0",    # the evals only
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
# local apply workflow only — CI never needs a browser
apply = [
    "playwright>=1.40",
]

[project.scripts]
job-finder = "job_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
