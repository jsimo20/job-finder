[project]
name = "boston-pm-tracker"
version = "0.1.0"
description = "Daily tracker for Senior+ PM roles at Boston/NYC/Hartford/remote-US companies."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
]

[tool.job_apply]
inputs_dir = "~/path/to/job-search/inputs"
applications_dir = "~/path/to/job-search/applications"
session_context_path = "~/.claude/ai_skills/SESSION_CONTEXT_Jobsearch.md"
resume_skill_path = "~/.claude/ai_skills/resume_generator/generate_resume.py"
cover_skill_path = "~/.claude/ai_skills/cover_letter_skill/generate_cover_letter.py"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
boston-pm-tracker = "boston_pm_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boston_pm_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
