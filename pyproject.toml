[project]
name = "boston-pm-tracker"
version = "0.1.0"
description = "Cron-driven tracker for senior PM roles, filtered and scored against a configurable profile."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
# local apply workflow only — CI never needs a browser
apply = [
    "playwright>=1.40",
]

[project.scripts]
boston-pm-tracker = "boston_pm_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boston_pm_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
