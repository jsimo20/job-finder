name: pm-digest

on:
  schedule:
    # 13:00 UTC every 3rd day of the month (1, 4, 7, 10, ...).
    # The day-of-month counter resets each month, so a calendar rollover can
    # produce a 1- or 2-day gap — acceptable for a low-frequency digest.
    - cron: "0 13 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m boston_pm_tracker.cli run

      - name: Commit updated data and digests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(digest): pipeline run $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main
            git push
          fi
